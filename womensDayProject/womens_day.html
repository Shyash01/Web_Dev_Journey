<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Women's Day</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family: 'Poppins', sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
}

#message{
    font-size:5.0rem;
    font-weight:bold;
    color:white;
    text-shadow:0 0 15px rgba(255,255,255,0.8);
    margin-top:20px;
}

.flower{
    width:120px;
    height:120px;
    position:relative;
    margin:auto;
    animation:bloom 2s ease-in-out forwards;
}

.petal{
    width:60px;
    height:60px;
    background:#ff4d6d;
    position:absolute;
    border-radius:50%;
}

.p1{top:0;left:30px;}
.p2{bottom:0;left:30px;}
.p3{left:0;top:30px;}
.p4{right:0;top:30px;}

.center{
    width:40px;
    height:40px;
    background:gold;
    border-radius:50%;
    position:absolute;
    top:40px;
    left:40px;
}

@keyframes bloom{
    from{
        transform:scale(0);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.heart{
    position:absolute;
    color:white;
    animation:float 4s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-800px);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="flower">
<div class="petal p1"></div>
<div class="petal p2"></div>
<div class="petal p3"></div>
<div class="petal p4"></div>
<div class="center"></div>
</div>

<div id="message"></div>

</div>

<script>

const text = "Happy International Women's Day 🌸";
let i=0;

function typeEffect(){
    if(i<text.length){
        document.getElementById("message").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeEffect,100);
    }
}

typeEffect();

function createHeart(){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*20+10)+"px";
    heart.style.animationDuration=(Math.random()*3+2)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },4000);
}

setInterval(createHeart,300);

</script>

</body>
</html>
